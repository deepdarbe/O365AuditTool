name: O365 Audit CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/o365audit-ci.yml"
      - "docs/DEPLOYMENT-DC.md"
      - "docs/O365-ARTIFACT-COPY-ARCHITECTURE.md"
      - "scripts/collector.ps1"
      - "scripts/Deploy-ManagementServer.ps1"
      - "scripts/Get-O365AuditDiagnostics.ps1"
      - "scripts/Install-O365AuditTool.ps1"
      - "scripts/Invoke-CollectorAccessDiagnostic.ps1"
      - "scripts/Invoke-ManualScan.ps1"
      - "scripts/New-O365AuditRelease.ps1"
      - "scripts/Test-O365AuditRelease.ps1"
      - "scripts/Test-O365AuditSmoke.ps1"
      - "src/O365AuditTool/**"
      - "tests/O365AuditTool.Tests/**"
      - "tests/dashboard.test.mjs"
      - "README.md"
      - "global.json"
  pull_request:
    paths:
      - ".github/workflows/o365audit-ci.yml"
      - "docs/DEPLOYMENT-DC.md"
      - "docs/O365-ARTIFACT-COPY-ARCHITECTURE.md"
      - "scripts/**"
      - "src/O365AuditTool/**"
      - "tests/O365AuditTool.Tests/**"
      - "tests/dashboard.test.mjs"
      - "README.md"
      - "global.json"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release for this version (e.g. 1.2.3). Leave empty to only run tests."
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\tests\O365AuditTool.Tests\O365AuditTool.Tests.csproj '-warnaserror:NU1901;NU1902;NU1903;NU1904'

      - name: Test
        shell: pwsh
        run: dotnet test .\tests\O365AuditTool.Tests\O365AuditTool.Tests.csproj -c Release --no-restore

      - name: Audit NuGet dependencies
        shell: pwsh
        run: dotnet list .\tests\O365AuditTool.Tests\O365AuditTool.Tests.csproj package --vulnerable --include-transitive --no-restore

      - name: Verify dotnet formatting
        shell: pwsh
        run: dotnet format .\tests\O365AuditTool.Tests\O365AuditTool.Tests.csproj --verify-no-changes --no-restore

      - name: Verify PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            '.\scripts\collector.ps1',
            '.\scripts\Deploy-ManagementServer.ps1',
            '.\scripts\Get-O365AuditDiagnostics.ps1',
            '.\scripts\Install-O365AuditTool.ps1',
            '.\scripts\Invoke-CollectorAccessDiagnostic.ps1',
            '.\scripts\Invoke-ManualScan.ps1',
            '.\scripts\New-O365AuditRelease.ps1',
            '.\scripts\Test-O365AuditRelease.ps1',
            '.\scripts\Test-O365AuditSmoke.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) > $null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file :: $($_.Message)" }
              exit 1
            }
          }

      - name: Analyze PowerShell
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Repository PSGallery -Force
          $files = @(
            '.\scripts\collector.ps1',
            '.\scripts\Deploy-ManagementServer.ps1',
            '.\scripts\Get-O365AuditDiagnostics.ps1',
            '.\scripts\Install-O365AuditTool.ps1',
            '.\scripts\Invoke-CollectorAccessDiagnostic.ps1',
            '.\scripts\Invoke-ManualScan.ps1',
            '.\scripts\New-O365AuditRelease.ps1',
            '.\scripts\Test-O365AuditRelease.ps1',
            '.\scripts\Test-O365AuditSmoke.ps1'
          )
          $findings = foreach ($file in $files) {
            Invoke-ScriptAnalyzer -Path $file -Severity Error
          }
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Error
            exit 1
          }

      - name: Verify dashboard JavaScript
        shell: pwsh
        run: |
          node --check .\src\O365AuditTool\wwwroot\app.js
          node --test .\tests\dashboard.test.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version and tag
        id: release_meta
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $version = $env:INPUT_VERSION.Trim().TrimStart('v')
          } else {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          if ($version -notmatch '^[0-9A-Za-z][0-9A-Za-z.-]{0,63}$') {
            throw "Gecersiz surum: '$version'."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build self-contained release
        shell: pwsh
        run: |
          .\scripts\New-O365AuditRelease.ps1 -Version '${{ steps.release_meta.outputs.version }}' -OutputDirectory .\dist

      - name: Verify release archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem .\dist\O365AuditTool-*.zip | Select-Object -First 1
          .\scripts\Test-O365AuditRelease.ps1 -ArchivePath $archive.FullName

      - name: Smoke test published application
        shell: pwsh
        run: |
          $archive = Get-ChildItem .\dist\O365AuditTool-*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath .\dist\smoke
          .\scripts\Test-O365AuditSmoke.ps1 -AppDirectory .\dist\smoke\app

      - name: Publish private GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release_meta.outputs.tag }}'
          $assets = @(
            (Get-ChildItem .\dist\O365AuditTool-*.zip).FullName
            (Get-ChildItem .\dist\O365AuditTool-*.zip.sha256).FullName
            (Get-ChildItem .\dist\Install-O365AuditTool-*.ps1).FullName
            (Get-ChildItem .\dist\Install-O365AuditTool-*.ps1.sha256).FullName
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            # Release already exists (e.g. created from the GitHub web UI); attach/refresh assets.
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "O365AuditTool $tag" --generate-notes --target $env:GITHUB_SHA
          }
